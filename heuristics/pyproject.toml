[project]
name = "heuristics"
version = "0.1.0"
description = ""
authors = [
    {name = "DESKTOP-77VUSS9\\pmw",email = "pmw9440@cyram.com"}
]
requires-python = ">=3.11"
dependencies = [
    "torch (==2.5.1)",
    "torchvision (==0.20.1)",
    "torchaudio (==2.5.1)",
    "torch-geometric (>=2.8.0,<3.0.0)",
    "ogb (>=1.3.6,<2.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "networkx (>=3.6.1,<4.0.0)"
]




[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
priority = "explicit"


[tool.poetry.dependencies]
python = ">=3.11,<3.14"
torch = {source = "pytorch-cu124"}
torchvision = {source = "pytorch-cu124"}
torchaudio = {source = "pytorch-cu124"}

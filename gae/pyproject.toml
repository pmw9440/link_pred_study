[project]
name = "gae"
version = "0.1.0"
description = ""
authors = [
    {name = "pmw9440",email = "pmw9440@cyram.com"}
]
requires-python = ">=3.11"
dependencies = [
    "torch (==2.5.1)",
    "torchvision (==0.20.1)",
    "torchaudio (==2.5.1)",
    "ogb (>=1.3.6,<2.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "torch-geometric (==2.5.1)",
    "requests (>=2.34.2,<3.0.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)"
]
package-mode = false  

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
torch = {source = "pytorch-cu124"}
torchvision = {source = "pytorch-cu124"}
torchaudio = {source = "pytorch-cu124"}
torch_scatter = { version = "*", source = "pyg-whl" }
torch_sparse = { version = "*", source = "pyg-whl" }
torch_cluster = { version = "*", source = "pyg-whl" }
torch_spline_conv = { version = "*", source = "pyg-whl" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pyg-whl"
url = "https://data.pyg.org/whl/torch-2.8.0+cpu.html"
priority = "explicit"


[[tool.poetry.source]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
priority = "explicit"


[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)"
]
